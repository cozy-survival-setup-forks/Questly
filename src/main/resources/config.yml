# Questly
#
# The quests are in quests.yml, the texts in lang.yml and the points shop in shop.yml.
# Reload them all with /questly admin reload.

board:
  # After somebody wins a quest, seconds until a new quest takes its place.
  cooldown-seconds: 1800
  # Avoid the same quest, or two quests that ask for the same thing, on the board at once.
  unique-quests: true
  # Players in creative or spectator mode do not get progress unless this is true.
  count-creative: false

# How often the progress of the players is saved, in seconds. Winning a quest is saved right away.
save-seconds: 60

# A chat message only counts for a chat quest when it is long enough and not sent too fast or twice in a row.
chat:
  min-length: 3
  cooldown-seconds: 3

# The quest menus. /quests opens the category menu below, a category opens its own board.
menu:
  # The title of a board. %category% is the name of the category.
  title: "&#FF9558%category%"
  # Rows of a board (1-6).
  rows: 3
  # Where the quests of a category go, as inventory slots (0 is the top left): a list such as [11, 13, 15],
  # or ranges such as "9-17". One quest is up in every slot, so this is also how many quests each category has.
  quest-slots: "9-17"
  # Fills every slot that has nothing in it. NONE leaves them empty.
  filler: BLACK_STAINED_GLASS_PANE
  # The button that goes back to the categories. -1 puts it in the middle of the bottom row.
  back-slot: -1
  back-item:
    material: ARROW
    name: "&#FF9558Back"
    lore:
      - "&#B6C1C8Quests"
      - ""
      - "&fBack to the categories."
  # Shown in the place of a quest that was won, until the next one starts.
  cooldown-item:
    material: CLOCK
    name: "&#FF9558Next quest in &f%time%"
    lore:
      - "&#B6C1C8Quests"
      - ""
      - "&fThis quest was won by &#FFE75C%winner%&f."

# The category menu. A quest is put in a category by what it asks for, or by a category: line in quests.yml
# (combat, mining, farming, animals, fishing, exploration or misc). Every button can also set a lore:
# list, with the placeholders %active% and %total%.
categories:
  title: "&#FF9558Quests"
  rows: 3
  filler: BLACK_STAINED_GLASS_PANE
  combat:
    slot: 10
    material: DIAMOND_SWORD
    name: "&#FF6E6ECombat Quests"
  mining:
    slot: 11
    material: DIAMOND_PICKAXE
    name: "&#68C8FFMining Quests"
  farming:
    slot: 12
    material: WHEAT
    name: "&#A8E6A3Farming Quests"
  animals:
    slot: 13
    material: BONE
    name: "&#FFE29AAnimal Quests"
  fishing:
    slot: 14
    material: FISHING_ROD
    name: "&#74C7FFFishing Quests"
  exploration:
    slot: 15
    material: COMPASS
    name: "&#AAA5FFExploration Quests"
  misc:
    slot: 16
    material: NETHER_STAR
    name: "&#FF8BB0Miscellaneous Quests"

# Messages sent to everybody. Turn one off with false, or set the text in lang.yml.
broadcasts:
  completed: true
  new-quest: false
  # Tell the leader of a quest when somebody passes them.
  taken-over: true

# Anonymous usage beacon: plugin name/version, server software/version and online/max player
# counts, nothing else. Set to false to turn it off.
metrics:
  enabled: true
  interval-minutes: 45
