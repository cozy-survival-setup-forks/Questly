# What players can buy with quest points, in /questly shop.
# Same layout as our other menus (menu_title, size, items with material/slot/display_name/lore/
# left_click_commands), so the menu style converter can restyle it too.
#
# left_click_commands run as the console unless tagged: [player] runs it as the buyer,
# [message] sends the buyer a line, [close] closes the shop. %player% is the buyer's name.
# "give" hands the buyer an item directly instead of (or as well as) running a command, for
# rewards that need no permission plugin or economy command.

menu_title: "&#FF9558Quest Shop"
size: 27
filler: BLACK_STAINED_GLASS_PANE

items:
  diamonds:
    slot: 10
    price: 10
    material: DIAMOND
    display_name: "&#9ED8FF5 Diamonds"
    lore:
      - "&#B6C1C8Shop"
      - ""
      - "&fPrice: &#FF8BB0%price% points"
      - "&fYou have: &#FF8BB0%points% points"
    give:
      - material: DIAMOND
        amount: 5
  experience:
    slot: 12
    price: 6
    material: EXPERIENCE_BOTTLE
    display_name: "&#A8E6A3500 Experience"
    lore:
      - "&#B6C1C8Shop"
      - ""
      - "&fPrice: &#FF8BB0%price% points"
      - "&fYou have: &#FF8BB0%points% points"
    left_click_commands:
      - "[console] xp add %player% 500 points"
  netherite:
    slot: 14
    price: 40
    material: NETHERITE_INGOT
    display_name: "&#FFC8A2Netherite Ingot"
    lore:
      - "&#B6C1C8Shop"
      - ""
      - "&fPrice: &#FF8BB0%price% points"
      - "&fYou have: &#FF8BB0%points% points"
    give:
      - material: NETHERITE_INGOT
        amount: 1
  golden-apples:
    slot: 16
    price: 8
    material: ENCHANTED_GOLDEN_APPLE
    display_name: "&#FFE29AEnchanted Golden Apple"
    lore:
      - "&#B6C1C8Shop"
      - ""
      - "&fPrice: &#FF8BB0%price% points"
      - "&fYou have: &#FF8BB0%points% points"
    give:
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 1
